services:
  db:
    image: postgres:17
    container_name: waypoint-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waypoint
    ports:
      - "5435:5432"
    volumes:
      - waypoint-db-data:/var/lib/postgresql/data

volumes:
  waypoint-db-data: